[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branchpoint"
version = "0.1.0"
description = "Reproducibly branch consequential decisions in files-as-state agent analyses"
readme = "branchpoint/README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Source = "ANONYMIZED"
Issues = "ANONYMIZED"

[project.optional-dependencies]
experiments = [
  "anthropic>=1.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openai>=3.6",
  "pandas>=2.2",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "tqdm>=4.66",
]
test = ["pytest>=8", "ruff>=0.16"]

[tool.setuptools]
packages = ["branchpoint"]
include-package-data = false

[tool.setuptools.package-data]
branchpoint = ["*.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
